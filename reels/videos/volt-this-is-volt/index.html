<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0d18; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0d18; color: #ecf3ff; font-family: "Space Grotesk", sans-serif; -webkit-font-smoothing: antialiased; }
.clip { position: absolute; inset: 0; }
.sc-in, .sc-out { position: absolute; inset: 0; }

/* background */
#glow1 { position: absolute; width: 1500px; height: 1500px; left: -420px; top: -460px; background: radial-gradient(circle, rgba(61,123,255,0.30), rgba(61,123,255,0.08) 38%, rgba(61,123,255,0) 64%); }
#glow2 { position: absolute; width: 1300px; height: 1300px; right: -560px; bottom: -260px; background: radial-gradient(circle, rgba(110,80,255,0.16), rgba(255,70,85,0.05) 40%, transparent 64%); }
#grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(120,150,220,0.075) 1px, transparent 1px), linear-gradient(90deg, rgba(120,150,220,0.075) 1px, transparent 1px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(ellipse 85% 60% at 50% 42%, #000 25%, transparent 82%); mask-image: radial-gradient(ellipse 85% 60% at 50% 42%, #000 25%, transparent 82%); }
#grain { position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse 95% 75% at 50% 45%, transparent 52%, rgba(0,0,0,0.6)); }
#fadein { position: absolute; inset: 0; background: #05070d; }

/* type */
.ln { overflow: hidden; font-family: "Rajdhani", sans-serif; font-weight: 700; text-transform: uppercase; line-height: 0.92; letter-spacing: 0.005em; color: #ecf3ff; padding-top: 0.05em; }
.ln-i { display: block; }
.c-hot { color: #ff4655; }
.c-volt { color: #5b8dff; }
.c-money { color: #3ddc84; }
.c-gold { color: #f5c453; }
.lab { display: flex; align-items: center; gap: 18px; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 27px; letter-spacing: 0.3em; color: #7da6ff; text-transform: uppercase; margin-bottom: 24px; }
.lab i { display: block; height: 2px; flex: 1; max-width: 360px; background: linear-gradient(90deg, #3d7bff, rgba(61,123,255,0)); transform-origin: 0 50%; }
.stripe { height: 12px; margin-top: 30px; transform-origin: 0 50%; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); box-shadow: 0 0 24px rgba(255,70,85,0.6); }
.sub { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 42px; line-height: 1.3; color: rgba(205,218,255,0.78); margin-top: 32px; max-width: 900px; }

/* hook */
.hook-txt { position: absolute; left: 90px; right: 90px; }
.art { position: absolute; left: 0; top: 0; width: 1080px; height: 1250px; overflow: hidden; }
.art img { position: absolute; top: 0; }
.art-fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,13,24,0.45) 0%, rgba(10,13,24,0) 22%, rgba(10,13,24,0.1) 50%, rgba(10,13,24,0.8) 80%, #0a0d18 100%); }
.agent { position: absolute; top: 120px; width: 720px; height: 1360px; }
.agent::before { content: ""; position: absolute; left: 60px; right: 60px; top: 180px; height: 900px; background: radial-gradient(ellipse at 50% 40%, rgba(61,123,255,0.35), transparent 65%); }
.agent img { position: absolute; bottom: 0; left: 0; height: 1360px; width: 723px; filter: saturate(0.9) brightness(0.92) drop-shadow(0 0 30px rgba(61,123,255,0.25)); }
.agent-glow { position: absolute; left: -40px; right: -40px; bottom: -2px; height: 760px; background: linear-gradient(rgba(10,13,24,0), rgba(10,13,24,0.75) 45%, #0a0d18 90%); }

/* screen */
.frame-pos { position: absolute; left: 60px; width: 960px; filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6)) drop-shadow(0 0 40px rgba(61,123,255,0.18)); }
.bw-wrap { position: relative; }
.bw { position: relative; width: 960px; background: #0d1324; border: 1px solid rgba(120,150,220,0.28); clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px)); }
.bw-bar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 20px; background: linear-gradient(#151c33, #0f1528); border-bottom: 1px solid rgba(120,150,220,0.18); }
.bw-bar b { display: block; width: 10px; height: 10px; background: rgba(160,180,230,0.28); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
.bw-url { margin-left: 18px; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 21px; letter-spacing: 0.18em; color: rgba(205,218,255,0.62); white-space: nowrap; }
.bw-url em { color: #7da6ff; font-style: normal; }
.bw-live { margin-left: auto; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.22em; color: #ff4655; }
.view { position: relative; overflow: hidden; background: #0d1324; }
.view.full { position: absolute; left: 0; top: 0; }
.plate { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.plate img { display: block; width: 1920px; height: 1080px; }
.view-vig { position: absolute; inset: 0; box-shadow: inset 0 0 90px rgba(5,8,16,0.75); }
.full-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,13,24,0.98) 0%, rgba(10,13,24,0.95) 27%, rgba(10,13,24,0.3) 40%, rgba(10,13,24,0.1) 58%, rgba(10,13,24,0.5) 78%, rgba(10,13,24,0.96) 100%); }
.br { position: absolute; width: 30px; height: 30px; border: 0 solid #3d7bff; }
.br.tl { left: -14px; top: -14px; border-top-width: 3px; border-left-width: 3px; }
.br.tr { right: -14px; top: -14px; border-top-width: 3px; border-right-width: 3px; }
.br.bl { left: -14px; bottom: -14px; border-bottom-width: 3px; border-left-width: 3px; }
.br.brr { right: -14px; bottom: -14px; border-bottom-width: 3px; border-right-width: 3px; }
.head { position: absolute; left: 90px; right: 90px; top: 236px; }
.head-full { top: 250px; }

.ov-box, .ov-pulse { position: absolute; }
.ov-box i { position: absolute; display: block; }
.ov-tag { position: absolute; font-family: "Rajdhani", sans-serif; font-weight: 700; color: #06101f; letter-spacing: 0.08em; white-space: nowrap; line-height: 1.15; text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 0.4em) 0, 100% 0.4em, 100% 100%, 0 100%); }
.cursor { position: absolute; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.65)); transform-origin: 15% 10%; }
.ripple { position: absolute; border: 0 solid #fff; border-radius: 50%; opacity: 0; }

.count { position: absolute; left: 0; right: 0; text-align: center; }
.count-k { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.3em; color: #7da6ff; text-transform: uppercase; }
.count-v { display: inline-block; font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 150px; line-height: 1.05; text-shadow: 0 0 50px currentColor; }

.toast { position: absolute; width: 540px; padding: 22px 30px 24px; background: rgba(14,20,38,0.96); border: 1px solid rgba(120,150,220,0.32); border-left: 7px solid #3d7bff; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); }
.toast.right { right: 36px; }
.toast.left { left: 36px; }
.toast-k { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 25px; letter-spacing: 0.24em; text-transform: uppercase; }
.toast-v { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 50px; line-height: 1; margin-top: 8px; text-transform: uppercase; }

.stamp-wrap { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
.stamp { padding: 30px 80px 34px; border: 9px solid var(--c); color: var(--c); background: rgba(8,11,20,0.88); text-align: center; box-shadow: 0 0 80px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 40px color-mix(in srgb, var(--c) 25%, transparent); }
.stamp-t { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 210px; line-height: 0.82; letter-spacing: 0.05em; text-transform: uppercase; }
.stamp-s { font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 40px; color: #ecf3ff; margin-top: 14px; letter-spacing: 0.04em; }
.flash { position: absolute; inset: 0; background: #cfe0ff; opacity: 0; mix-blend-mode: overlay; }

/* stat */
.stat-wrap { position: absolute; left: 90px; right: 90px; top: 640px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 64px; }
.stat-c { flex: 1 1 260px; padding: 34px 30px 30px; background: linear-gradient(#121a2e, #0a0e19); border: 1px solid rgba(120,150,220,0.24); clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px)); }
.stat-c.big { flex-basis: 100%; background: none; border: 0; padding: 0; clip-path: none; }
.stat-v { font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 92px; line-height: 1; }
.big .stat-v { font-size: 200px; text-shadow: 0 0 70px currentColor; letter-spacing: -0.02em; }
.stat-l { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.22em; color: rgba(205,218,255,0.62); margin-top: 14px; text-transform: uppercase; }
.big .stat-l { font-size: 40px; }

/* list */
.list-wrap { position: absolute; left: 90px; right: 90px; }
.rows { margin-top: 60px; display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; align-items: center; gap: 28px; height: 118px; padding: 0 32px; background: linear-gradient(90deg, rgba(22,31,56,0.96), rgba(13,19,36,0.75)); border: 1px solid rgba(120,150,220,0.22); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
.row-ic { flex: 0 0 auto; width: 66px; height: 66px; border: 2px solid; display: flex; align-items: center; justify-content: center; background: rgba(10,13,24,0.6); }
.row-ic svg { width: 40px; height: 40px; }
.row-t { position: relative; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 54px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
.row-x { position: absolute; left: -8px; right: -8px; top: 50%; height: 6px; margin-top: -3px; background: #ff4655; transform-origin: 0 50%; box-shadow: 0 0 16px rgba(255,70,85,0.7); }
.row-k { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 32px; color: #7da6ff; white-space: nowrap; }

/* montage */
.mo-word { position: absolute; left: 40px; right: 40px; top: 1180px; text-align: center; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 220px; line-height: 0.85; text-transform: uppercase; color: #fff; text-shadow: 0 10px 50px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.6); }
.mo-small { position: absolute; left: 0; right: 0; top: 1380px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 40px; color: #7da6ff; letter-spacing: 0.08em; text-shadow: 0 4px 20px rgba(0,0,0,0.9); }

/* cta */
.cta { position: absolute; left: 90px; right: 90px; top: 360px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.crest-wrap { position: relative; width: 230px; height: 253px; }
.crest { position: absolute; inset: 0; filter: drop-shadow(0 0 46px rgba(61,123,255,0.65)); }
.ring { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border: 2px solid rgba(125,166,255,0.7); opacity: 0; }
.cta-word { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 36px; letter-spacing: 0.2em; color: #7da6ff; margin-top: 50px; white-space: nowrap; }
.cta-lines { margin-top: 34px; width: 100%; }
.cta-lines .ln { text-align: center; }
.cta-feat { margin-top: 38px; font-family: "Rajdhani", sans-serif; font-weight: 600; font-size: 33px; letter-spacing: 0.12em; color: rgba(205,218,255,0.68); text-transform: uppercase; line-height: 1.4; }
.btn { position: relative; overflow: hidden; margin-top: 60px; padding: 30px 66px 28px; background: linear-gradient(#4d88ff, #2f66e0); clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px)); font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 46px; letter-spacing: 0.14em; color: #fff; white-space: nowrap; }
.btn span { position: relative; }
.btn-sh { position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: linear-gradient(105deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 80%); }

/* transitions */
.sweep { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: linear-gradient(100deg, transparent 34%, rgba(61,123,255,0.16) 46%, rgba(170,200,255,0.32) 50%, rgba(61,123,255,0.16) 54%, transparent 66%); mix-blend-mode: screen; }
.ghost { position: absolute; right: -40px; top: 300px; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 760px; line-height: 0.8; color: transparent; -webkit-text-stroke: 2px rgba(125,166,255,0.16); white-space: nowrap; }

/* stage: the floating screen + lifted cards */
.p3-pos { position: absolute; inset: 0; }
.p3 { position: absolute; }
.p3-glow { position: absolute; left: -12%; right: -12%; top: -18%; bottom: -18%; background: radial-gradient(ellipse at 50% 50%, rgba(61,123,255,0.22), rgba(61,123,255,0.06) 45%, rgba(61,123,255,0) 70%); }
.p3-face { position: absolute; inset: 0; overflow: hidden; border-radius: 22px; background: #0d1324;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%), linear-gradient(180deg, transparent 0, #000 11%, #000 86%, transparent 100%);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%), linear-gradient(180deg, transparent 0, #000 11%, #000 86%, transparent 100%); mask-composite: intersect; }
.p3 img { display: block; }
.p3-glare { position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(125,166,255,0.06) 100%); }
.p3-dim { position: absolute; inset: 0; background: #060912; opacity: 0; }
.p3-hl { position: absolute; border: 2px solid #3d7bff; box-shadow: 0 0 24px rgba(61,123,255,0.8), inset 0 0 18px rgba(61,123,255,0.35); opacity: 0; z-index: 2; }
.p3-floor { position: absolute; height: 260px; background: radial-gradient(ellipse at 50% 30%, rgba(61,123,255,0.28), rgba(61,123,255,0) 62%); }
.piece { position: absolute; }
.piece-in { position: absolute; inset: 0; filter: drop-shadow(0 40px 50px rgba(0,0,0,0.6)) drop-shadow(0 0 34px rgba(61,123,255,0.32)); }
.piece-clip { position: absolute; inset: 0; overflow: hidden; background: #0d1324; }
.piece-clip.feather { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 3%, #000 97%, transparent 100%), linear-gradient(180deg, transparent 0, #000 2.5%, #000 97.5%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent 0, #000 3%, #000 97%, transparent 100%), linear-gradient(180deg, transparent 0, #000 2.5%, #000 97.5%, transparent 100%); mask-composite: intersect; }
.piece-clip img { position: absolute; max-width: none; }
.live { position: absolute; }
.live-v { position: absolute; left: 0; right: 0; top: 50%; transform-origin: 50% 50%; margin-top: -0.6em; line-height: 1.2; text-align: center; white-space: nowrap; }
.live-mono .live-v { font-family: "IBM Plex Mono", monospace; font-weight: 700; text-shadow: 0 0 18px rgba(61,123,255,0.6); }
.live-raj .live-v { font-family: "Rajdhani", sans-serif; font-weight: 700; text-transform: uppercase; }
.pc-focus { position: absolute; }
.pc-focus i { position: absolute; display: block; width: 26px; height: 26px; border: 3px solid; }
.pc-focus b { position: absolute; left: -3px; top: -46px; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.1em; color: #06101f; padding: 3px 12px; white-space: nowrap; }

/* captured app clips */
.vid { right: auto; bottom: auto; object-fit: cover; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(180deg, transparent 0, #000 5%, #000 93%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(180deg, transparent 0, #000 5%, #000 93%, transparent 100%); mask-composite: intersect; }
/* the logo sting */
.logo-wrap { position: relative; width: 653px; height: 249px; }
.cta-logo { position: relative; display: block; overflow: visible; }
.logo-glow { position: absolute; left: -60px; top: -80px; width: 480px; height: 420px; background: radial-gradient(ellipse at 45% 55%, rgba(61,123,255,0.55), rgba(61,123,255,0) 65%); opacity: 0; }
.logo-ring { position: absolute; left: 70px; top: -30px; width: 300px; height: 300px; border: 2px solid rgba(125,166,255,0.7); border-radius: 50%; opacity: 0; }
.cta-tag { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.42em; color: #6f9bff; margin-top: 30px; white-space: nowrap; }

/* the auction draw */
.dr-glow { position: absolute; left: 0; right: 0; height: 840px; background: radial-gradient(ellipse 34% 46% at 50% 50%, rgba(61,123,255,0.34), rgba(61,123,255,0) 70%); opacity: 0.55; }
.dr-band { position: absolute; left: 0; right: 0; overflow: hidden; }
.dr-strip { position: absolute; left: 0; height: 0; will-change: transform; }
.dr-card { position: absolute; top: 0; height: auto; display: block; transform-origin: 50% 50%; clip-path: polygon(0 0, 93.5% 0, 100% 5%, 100% 100%, 6.5% 100%, 0 95%); }
.dr-fade { position: absolute; top: 0; bottom: 0; width: 150px; z-index: 5; }
.dr-fade.l { left: 0; background: linear-gradient(90deg, #0a0d18, rgba(10,13,24,0)); }
.dr-fade.r { right: 0; background: linear-gradient(270deg, #0a0d18, rgba(10,13,24,0)); }
.dr-marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 0; z-index: 6; }
.dr-marker .t, .dr-marker .b { position: absolute; left: -15px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; filter: drop-shadow(0 0 10px rgba(255,70,85,0.9)); }
.dr-marker .t { top: 6px; border-top: 24px solid #ff4655; }
.dr-marker .b { bottom: 6px; border-bottom: 24px solid #ff4655; }
.dr-marker .ln { position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, transparent, rgba(255,70,85,0.5), transparent); }
.dr-count { position: absolute; left: 0; right: 0; text-align: center; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.24em; color: rgba(236,243,255,0.45); }
.dr-reveal { position: absolute; left: 0; right: 0; text-align: center; }
.dr-name { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 96px; line-height: 1; text-transform: uppercase; text-shadow: 0 0 40px rgba(200,215,255,0.45); opacity: 0; }
.dr-sub { font-family: "Rajdhani", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.16em; color: rgba(236,243,255,0.6); margin-top: 10px; text-transform: uppercase; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="14.5" data-width="1080" data-height="1920">
<div id="bg" class="clip" data-start="0" data-duration="14.5" data-track-index="0"><div id="glow1"></div><div id="glow2"></div><div id="grid"></div><div id="grain"></div><div id="vig"></div></div>
<div id="s1" class="clip scene" data-start="0" data-duration="2" data-track-index="1"><div class="sc-in" id="s1-in"><div class="sc-out" id="s1-out"><div class="ghost" id="s1-gh">V</div><div class="hook-txt" style="top:700px"><div class="ln " style="font-size:190px"><span id="s1-l0" class="ln-i">THIS IS</span></div><div class="ln " style="font-size:190px"><span id="s1-l1" class="ln-i"><span class="c-hot">VOLT.</span></span></div><div class="stripe" id="s1-st" style="width:260px;background:#ff4655"></div></div></div></div></div>
