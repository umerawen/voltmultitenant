# Builds the Android app (a debug APK you can install on any Android phone) in
# the cloud on every push to main that touches the app, and on demand from the
# Actions tab. No Android Studio needed on your machine.
#
# Config comes from committed files: .env.production (the public Supabase URL
# and key, VITE_PUSH) and android/app/google-services.json (Firebase client config).
# The APK is attached to the run as the "volt-android" artifact.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".env.production"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      # No VITE_* env here on purpose: an unset secret or variable arrives as an
      # empty string, which would override .env.production.
      - name: Build the web app
        run: npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: volt-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
